# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Deep sleep after 15 min idle (value in ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Turn off the display/LEDs sooner (default is 30 s)
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# Enable mouse controls
CONFIG_ZMK_POINTING=y

# Nice OLED config options
# CONFIG_NICE_OLED_ON=y
# CONFIG_LV_Z_VDB_SIZE=64
# CONFIG_LV_DPI_DEF=148
